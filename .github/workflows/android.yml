name: Build Android launcher

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../allo-os.apk

      - uses: actions/upload-artifact@v4
        with:
          name: allo-os-apk
          path: allo-os.apk

      # On main, publish a release so the APK can be downloaded straight to a phone from
      # https://github.com/<owner>/<repo>/releases/latest/download/allo-os.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-v1.0.${{ github.run_number }}
          name: allo OS 1.0.${{ github.run_number }}
          make_latest: true
          files: allo-os.apk
          body: |
            Install on an Android phone: download **allo-os.apk**, open it, and allow installing from this source.
            Then press Home and choose **allo** (Always).
