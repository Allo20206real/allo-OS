<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camera</title>
<link rel="stylesheet" href="../../sdk/allo.css">
<script src="../../sdk/allo.js"></script>
<style>
  html, body { background: #000 !important; color: #fff; overflow: hidden; }
  .cam { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: var(--sat); }
  .view { position: relative; flex: 1; margin: 6px 0 0; overflow: hidden; border-radius: 20px; background: #111; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  video.mirror { transform: scaleX(-1); }
  .msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 30px; color: rgba(255,255,255,.8); font-size: 15px; }
  .msg b { display: block; color: #fff; font-size: 18px; margin-bottom: 6px; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  .flash.on { animation: fl .35s ease-out; }
  @keyframes fl { 0% { opacity: .9; } 100% { opacity: 0; } }
  .modes { display: flex; justify-content: center; gap: 22px; padding: 14px 0 6px; font-size: 14px; font-weight: 600; letter-spacing: .04em; color: rgba(255,255,255,.55); }
  .modes .on { color: #ffd54a; }
  .bar { display: flex; align-items: center; justify-content: space-around; padding: 10px 24px calc(var(--sab) + 14px); }
  .shutter { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; padding: 4px; }
  .shutter i { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: transform .1s; }
  .shutter:active i { transform: scale(.88); }
  .thumb { width: 50px; height: 50px; border-radius: 14px; background: #222 center / cover; border: 2px solid rgba(255,255,255,.2); }
  .flip { width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.14); display: grid; place-items: center; color: #fff; }
  .grid-lines { position: absolute; inset: 0; pointer-events: none; background:
    linear-gradient(90deg, transparent calc(33.33% - .5px), rgba(255,255,255,.25) 0, rgba(255,255,255,.25) calc(33.33% + .5px), transparent 0, transparent calc(66.66% - .5px), rgba(255,255,255,.25) 0, rgba(255,255,255,.25) calc(66.66% + .5px), transparent 0),
    linear-gradient(transparent calc(33.33% - .5px), rgba(255,255,255,.25) 0, rgba(255,255,255,.25) calc(33.33% + .5px), transparent 0, transparent calc(66.66% - .5px), rgba(255,255,255,.25) 0, rgba(255,255,255,.25) calc(66.66% + .5px), transparent 0); }
</style>
</head>
<body>
<div class="cam">
  <div class="view">
    <video id="v" playsinline muted autoplay></video>
    <div class="grid-lines"></div>
    <div class="msg" id="msg"><div>Starting camera…</div></div>
    <div class="flash" id="flash"></div>
  </div>
  <div class="modes"><span class="on">PHOTO</span></div>
  <div class="bar">
    <button class="thumb" id="thumb" aria-label="Open Gallery"></button>
    <button class="shutter" id="shot" aria-label="Take photo"><i></i></button>
    <button class="flip" id="flip" aria-label="Switch camera"><svg class="i" viewBox="0 0 24 24"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2M14 9v2h-2M10 17v-2h2"/></svg></button>
  </div>
</div>
<script>
document.documentElement.dataset.theme = 'dark';
allo.on('env', () => { document.documentElement.dataset.theme = 'dark'; });
allo.statusBar('light');
const v = document.getElementById('v'), msg = document.getElementById('msg');
let stream = null, facing = 'environment';

async function start() {
  stop();
  if (!navigator.mediaDevices?.getUserMedia) { msg.innerHTML = '<div><b>No camera access</b>This browser does not allow camera use here. Open allo OS over https.</div>'; msg.hidden = false; return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    v.srcObject = stream;
    const s = stream.getVideoTracks()[0].getSettings();
    v.classList.toggle('mirror', s.facingMode ? s.facingMode === 'user' : facing === 'user' || !/android|iphone|ipad/i.test(navigator.userAgent));
    msg.hidden = true;
  } catch (e) {
    msg.innerHTML = `<div><b>Camera unavailable</b>${e.name === 'NotAllowedError' ? 'Allow camera access to take photos.' : 'No camera was found on this device.'}</div>`;
    msg.hidden = false;
  }
}
function stop() { stream?.getTracks().forEach(t => t.stop()); stream = null; }

async function refreshThumb() {
  try {
    const p = (await allo.photos.list())[0];
    const t = document.getElementById('thumb');
    if (t.dataset.url) URL.revokeObjectURL(t.dataset.url);
    if (p) { const u = URL.createObjectURL(p.blob); t.dataset.url = u; t.style.backgroundImage = `url(${u})`; }
  } catch {}
}

document.getElementById('shot').onclick = async () => {
  if (!stream || !v.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = v.videoWidth; c.height = v.videoHeight;
  const ctx = c.getContext('2d');
  if (v.classList.contains('mirror')) { ctx.translate(c.width, 0); ctx.scale(-1, 1); }
  ctx.drawImage(v, 0, 0);
  const f = document.getElementById('flash'); f.classList.remove('on'); void f.offsetWidth; f.classList.add('on');
  allo.haptic(15);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  await allo.photos.add(blob, 'camera');
  refreshThumb();
};
document.getElementById('flip').onclick = () => { facing = facing === 'user' ? 'environment' : 'user'; start(); };
document.getElementById('thumb').onclick = () => allo.open('gallery').catch(() => allo.notify('Gallery', 'Install Gallery from the App Store to view photos.'));
allo.on('hide', stop);
allo.on('show', () => { start(); refreshThumb(); });
start(); refreshThumb();
</script>
</body>
</html>
