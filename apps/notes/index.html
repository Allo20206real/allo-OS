<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes</title>
<link rel="stylesheet" href="../../sdk/allo.css">
<script src="../../sdk/allo.js"></script>
<style>
  :root { --accent-notes: #f5a300; }
  .view { position: absolute; inset: 0; display: flex; flex-direction: column; padding-top: var(--sat); background: var(--bg); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 4px 16px calc(var(--sab) + 100px); }
  .note { background: var(--card); border-radius: 18px; padding: 14px; min-height: 120px; max-height: 210px; overflow: hidden; cursor: pointer;
    box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; text-align: left; transition: transform .12s; }
  .note:active { transform: scale(.97); }
  .note b { font-size: 15.5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .note p { margin: 0; font-size: 13.5px; color: var(--fg2); line-height: 1.4; flex: 1; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
  .note small { font-size: 11.5px; color: var(--fg3); }
  .fab { background: var(--accent-notes); box-shadow: 0 8px 24px rgba(245, 163, 0, .4); }
  .editor { flex: 1; display: flex; flex-direction: column; padding: 0 20px calc(var(--sab) + 10px); }
  .editor input { border: 0; outline: none; background: none; color: var(--fg); font: 700 26px var(--font); padding: 6px 0; letter-spacing: -.01em; }
  .editor .meta { font-size: 13px; color: var(--fg3); margin-bottom: 10px; }
  .editor textarea { flex: 1; border: 0; outline: none; background: none; color: var(--fg); font: 17px/1.55 var(--font); resize: none; padding: 0; }
  .navbar .back, .navbar .right button { color: var(--accent-notes); }
  .navbar .right button { font-weight: 600; font-size: 16px; padding: 8px; }
  .enter { animation: push .32s cubic-bezier(.2, .9, .25, 1); }
  @keyframes push { from { transform: translateX(24%); opacity: .3; } }
  .search { margin: 0 16px 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let notes = allo.store.get('notes', null);
if (!notes) {
  notes = [{ id: 'welcome', title: 'Welcome to Notes', body: 'Tap + to write a new note.\nEverything is saved automatically on this device.', updated: Date.now() }];
  allo.store.set('notes', notes);
}
let q = '';
const save = () => allo.store.set('notes', notes);
const when = t => {
  const d = new Date(t), now = new Date();
  return d.toDateString() === now.toDateString() ? d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : d.toLocaleDateString([], { month: 'short', day: 'numeric' });
};

function list(anim) {
  const shown = notes.filter(n => !q || (n.title + ' ' + n.body).toLowerCase().includes(q.toLowerCase())).sort((a, b) => b.updated - a.updated);
  $('#root').innerHTML = `<div class="view ${anim ? 'enter' : ''}" style="overflow-y:auto">
    <div class="titlebar"><h1>Notes</h1><span class="muted" style="font-size:14px">${notes.length} note${notes.length === 1 ? '' : 's'}</span></div>
    <div class="search"><input class="field" id="q" type="search" placeholder="Search notes" value="${esc(q)}"></div>
    ${shown.length ? `<div class="grid">${shown.map(n => `<button class="note" data-id="${n.id}"><b>${esc(n.title || 'Untitled')}</b><p>${esc(n.body.slice(0, 240))}</p><small>${when(n.updated)}</small></button>`).join('')}</div>`
      : `<div class="empty"><svg class="i" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h4"/></svg><b>${q ? 'No matches' : 'No notes yet'}</b>${q ? 'Try a different word.' : 'Tap + to start writing.'}</div>`}
    <button class="fab" id="new" aria-label="New note"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>`;
}

function edit(id) {
  let n = notes.find(x => x.id === id);
  const fresh = !n;
  if (!n) { n = { id: Date.now().toString(36), title: '', body: '', updated: Date.now() }; }
  $('#root').innerHTML = `<div class="view enter">
    <div class="navbar"><button class="back" id="back"><svg class="i" viewBox="0 0 24 24"><path d="m15 6-6 6 6 6"/></svg>Notes</button><div></div>
      <div class="right"><button id="del">${fresh ? '' : 'Delete'}</button></div></div>
    <div class="editor">
      <input id="t" placeholder="Title" value="${esc(n.title)}">
      <div class="meta">${new Date(n.updated).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</div>
      <textarea id="b" placeholder="Start writing…">${esc(n.body)}</textarea>
    </div></div>`;
  const commit = () => {
    const title = $('#t').value.trim(), body = $('#b').value;
    if (!title && !body.trim()) { notes = notes.filter(x => x.id !== n.id); save(); return; }
    if (title !== n.title || body !== n.body) {
      n.title = title; n.body = body; n.updated = Date.now();
      if (!notes.includes(n)) notes.push(n);
      save();
    }
  };
  $('#t').oninput = $('#b').oninput = () => { clearTimeout(edit.t); edit.t = setTimeout(commit, 400); };
  $('#back').onclick = () => { commit(); list(); };
  $('#del').onclick = () => { if (fresh) return; notes = notes.filter(x => x.id !== n.id); save(); list(); };
  if (fresh) setTimeout(() => $('#t').focus(), 80);
}

document.addEventListener('click', e => {
  const n = e.target.closest('.note');
  if (n) edit(n.dataset.id);
  if (e.target.closest('#new')) edit(null);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { q = e.target.value; const pos = e.target.selectionStart; list(); const f = $('#q'); f.focus(); f.setSelectionRange(pos, pos); }
});
allo.on('back', () => { const b = document.getElementById('back'); if (b) { b.click(); return true; } });
list();
</script>
</body>
</html>
